[build-system]
requires = ["uv_build~=0.12"]
build-backend = "uv_build"

[project]
name = "pyriodicity"
version = "0.9.0rc0"
description = "Efficient periodicity length detection for univariate signals in Python."
license = "MIT"
readme = "README.md"
authors = [{ name = "Iskander Gaba", email = "iskander@hey.com" }]
requires-python = ">=3.12"
keywords = [
    "period",
    "periodicity",
    "seasonality",
    "period-detection",
    "periodicity-analysis",
    "seasonality-analysis",
    "autoperiod",
    "cfd-autoperiod",
    "robustperiod",
    "sazed",
    "signal-processing",
    "time-series-analysis"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "numpy~=2.5.2",
    "scipy~=1.18.1",
    "pywavelets~=1.10.0",
    "free-threading~=1.2.0",
]

[project.urls]
Documentation = "https://pyriodicity.readthedocs.io"
Repository = "https://github.com/iskandergaba/pyriodicity"

[dependency-groups]
dev = [
    "ty~=0.0.80",
    "ruff~=0.17.0",
    "pandas~=3.0.6",
    "pytest~=9.1.0",
    "pytest-cov~=7.1.0",
]
docs = [
    "numpydoc~=1.11.0",
    "pydata-sphinx-theme~=0.23.0",
    "sphinx-autobuild~=2025.08.0",
]

[tool.ruff.lint]
extend-select = ["E501"]
